<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Credentials</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Supabase Credentials Test</h1>
    <button onclick="testCredentials()">Test Credentials</button>
    <button onclick="testAttributes()">Test Attributes Fetch</button>
    <button onclick="testAgents()">Test Agents Fetch</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        let config = {};
        
        function log(message, type = 'log') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            logs.appendChild(div);
 }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
 }
        
        async function loadDatabaseConfig() {
            try {
                const res = await fetch('/database_config.json');
                const json = await res.json();
                config.supabaseUrl = json.supabase.url;
                config.restUrl = json.supabase.rest_url;
                config.apiKey = json.supabase.client_api_key;
                config.serviceKey = json.supabase.service_key || null;
                
                log(`✅ Database config loaded successfully`, 'success');
                log(`Supabase URL: ${config.supabaseUrl}`, 'log');
                log(`REST URL: ${config.restUrl}`, 'log');
                log(`API Key: ${config.apiKey ? config.apiKey.substring(0, 20) + '...' : 'MISSING'}`, 'log');
                log(`Service Key: ${config.serviceKey ? config.serviceKey.substring(0, 20) + '...' : 'MISSING'}`, 'log');
                
                return true;
 } catch (err) {
                log(`❌ Failed to load database config: ${err.message}`, 'error');
                return false;
 }
 }
        
        function authHeaders(opts = {}) {
            const { useServiceKey = false } = opts;
            const token = localStorage.getItem('login_token') || '';
            const useBearer = (useServiceKey && config.serviceKey)
                ? config.serviceKey
                : ((token && token.length > 20) ? token : (config.apiKey || ''));
            const apiHeader = (useServiceKey && config.serviceKey) ? config.serviceKey : (config.apiKey || '');
            
            log(`🔑 Using ${useServiceKey ? 'SERVICE' : 'CLIENT'} key for auth`, 'log');
            log(`API Header: ${apiHeader ? apiHeader.substring(0, 20) + '...' : 'MISSING'}`, 'log');
            log(`Bearer Token: ${useBearer ? useBearer.substring(0, 20) + '...' : 'MISSING'}`, 'log');
            log(`Has Login Token: ${token.length > 20}`, 'log');
            
            return {
                'apikey': apiHeader,
                'Authorization': `Bearer ${useBearer}`,
                'Content-Type': 'application/json',
                'Prefer': 'count=exact'
 };
 }
        
        async function testCredentials() {
            clearLogs();
            log('🧪 Testing Supabase credentials...', 'log');
            
            const loaded = await loadDatabaseConfig();
            if (!loaded) return;
            
            // Test basic connectivity
            try {
                const response = await fetch(config.restUrl, { 
                    headers: authHeaders(),
                    method: 'GET'
 });
                
                if (response.ok) {
                    log('✅ Supabase REST API is accessible', 'success');
 } else {
                    log(`⚠️ Supabase REST API returned status: ${response.status}`, 'warning');
                    const text = await response.text();
                    log(`Response: ${text}`, 'warning');
 }
 } catch (err) {
                log(`❌ Failed to connect to Supabase: ${err.message}`, 'error');
 }
 }
        
        async function testAttributes() {
            clearLogs();
            log('🧪 Testing attributes fetch...', 'log');
            
            const loaded = await loadDatabaseConfig();
            if (!loaded) return;
            
            const url = `${config.restUrl}/New_SC_Attributes?select=*&order=ID.asc`;
            log(`Fetching from: ${url}`, 'log');
            
            try {
                // Try with client key first
                let res = await fetch(url, { headers: authHeaders() });
                if (!res.ok) {
                    const errText = await res.text();
                    log(`❌ Client key failed (${res.status}): ${errText}`, 'error');
                    
                    // Try with service key
                    log('🔄 Retrying with service key...', 'log');
                    res = await fetch(url, { headers: authHeaders({ useServiceKey: true }) });
                    if (!res.ok) {
                        const svcErr = await res.text();
                        log(`❌ Service key failed (${res.status}): ${svcErr}`, 'error');
                        return;
 }
 }
                
                const data = await res.json();
                log(`✅ Attributes loaded: ${data.length} items`, 'success');
                if (data.length > 0) {
                    log(`First attribute: ${JSON.stringify(data[0], null, 2)}`, 'log');
 }
 } catch (err) {
                log(`❌ Attributes fetch error: ${err.message}`, 'error');
 }
 }
        
        async function testAgents() {
            clearLogs();
            log('🧪 Testing agents fetch...', 'log');
            
            const loaded = await loadDatabaseConfig();
            if (!loaded) return;
            
            const url = `${config.restUrl}/users?select=id,Name,email,user_role&user_role=in.(MX-T2%20User,Administrator)&order=Name.asc`;
            log(`Fetching from: ${url}`, 'log');
            
            try {
                // Try with client key first
                let res = await fetch(url, { headers: authHeaders() });
                if (!res.ok) {
                    const errText = await res.text();
                    log(`❌ Client key failed (${res.status}): ${errText}`, 'error');
                    
                    // Try with service key
                    log('🔄 Retrying with service key...', 'log');
                    res = await fetch(url, { headers: authHeaders({ useServiceKey: true }) });
                    if (!res.ok) {
                        const svcErr = await res.text();
                        log(`❌ Service key failed (${res.status}): ${svcErr}`, 'error');
                        return;
 }
 }
                
                const data = await res.json();
                log(`✅ Agents loaded: ${data.length} items`, 'success');
                if (data.length > 0) {
                    log(`First agent: ${JSON.stringify(data[0], null, 2)}`, 'log');
 }
 } catch (err) {
                log(`❌ Agents fetch error: ${err.message}`, 'error');
 }
 }
        
        // Auto-load config on page load
        window.addEventListener('DOMContentLoaded', () => {
            log('🚀 Page loaded, ready to test credentials', 'log');
 });
    </script>
</body>
</html>

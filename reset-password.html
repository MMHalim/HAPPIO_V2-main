<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="global-theme.css">

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
    }
    .container {
      max-width: 420px;
      margin: 80px auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    button {
      width: 100%;
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: var(--primary-hover);
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }
    .status.error {
      color: var(--danger-color);
    }
    .status.success {
      color: var(--success-color);
    }
    .footer {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
    }
    .footer a {
      color: var(--primary-color);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🎯 HAPPIO<br/>Quality Management System</div>
    <div class="subtitle">Enter a new password to complete your recovery.</div>

    <div id="tokenStatus" class="status error"></div>

    <form id="resetForm">
      <div class="input-group">
        <label>New Password</label>
        <input type="password" id="newPassword" required minlength="6"/>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required minlength="6"/>
      </div>

      <button type="submit">Update Password</button>
      <div id="resetStatus" class="status"></div>
    </form>

    <div class="footer">
      <a href="/login.html">Back to Login</a>
    </div>
  </div>

  <script>
    // =========================
    // Supabase Configuration
    // =========================
    const SUPABASE_URL = 'https://kupaxfvjfobfdgtbfnnt.supabase.co'
    const ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cGF4ZnZqZm9iZmRndGJmbm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE2ODQwNjAwOTgsImV4cCI6MTk5OTYzNjA5OH0.C-6VUYI6VT0qr39K5rTSLt_hq6Y-dRBjIm6Dr-OGsaw'

    // =========================
    // Token Extraction
    // =========================
    const hash = window.location.hash.startsWith('#')
      ? window.location.hash.substring(1)
      : window.location.hash

    const params = new URLSearchParams(hash)
    const accessToken = params.get('access_token')
    const type = params.get('type')

    const tokenStatus = document.getElementById('tokenStatus')

    if (!accessToken || type !== 'recovery') {
      tokenStatus.style.display = 'block'
      tokenStatus.textContent =
        'Invalid or expired recovery link. Please request a new password reset.'
    }

    // =========================
    // Form Submission
    // =========================
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault()

      const password = document.getElementById('newPassword').value.trim()
      const confirm = document.getElementById('confirmPassword').value.trim()
      const status = document.getElementById('resetStatus')

      status.style.display = 'none'
      status.className = 'status'

      if (password.length < 6) {
        status.textContent = 'Password must be at least 6 characters.'
        status.classList.add('error')
        status.style.display = 'block'
        return
      }

      if (password !== confirm) {
        status.textContent = 'Passwords do not match.'
        status.classList.add('error')
        status.style.display = 'block'
        return
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'apikey': ANON_KEY,
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        })

        if (!res.ok) {
          const msg = await res.text()
          throw new Error(msg)
        }

        status.textContent = 'Password updated successfully. Redirecting...'
        status.classList.add('success')
        status.style.display = 'block'

        setTimeout(() => {
          window.location.href = '/login.html'
        }, 1500)

      } catch (err) {
        status.textContent = err.message || 'Failed to update password.'
        status.classList.add('error')
        status.style.display = 'block'
      }
    })
  </script>
</body>
</html>

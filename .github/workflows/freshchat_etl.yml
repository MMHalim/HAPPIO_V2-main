name: Freshchat Hourly ETL

on:
  workflow_dispatch:
    inputs:
      from_cairo:
        description: "From (Africa/Cairo) - YYYY-MM-DDTHH:MM"
        required: false
      to_cairo:
        description: "To (Africa/Cairo) - YYYY-MM-DDTHH:MM"
        required: false
      window_slot:
        description: "Optional Cairo slot key: 1705,1805,1905,2005,2105,2205,2305,0005,0105,0205"
        required: false
  schedule:
    # Run once per UTC hour at :05. The workflow itself resolves the current
    # Cairo slot and decides whether that hour is one of the allowed ETL windows.
    - cron: '5 * * * *'

jobs:
  run-etl:
    concurrency:
      group: freshchat-hourly-etl
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Resolve Cairo Time Window
        id: resolve_window
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM_CAIRO: ${{ github.event.inputs.from_cairo }}
          INPUT_TO_CAIRO: ${{ github.event.inputs.to_cairo }}
          INPUT_WINDOW_SLOT: ${{ github.event.inputs.window_slot }}
        run: |
          python <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Africa/Cairo")
          event_name = (os.getenv("GITHUB_EVENT_NAME") or "").strip()
          from_input = (os.getenv("INPUT_FROM_CAIRO") or "").strip()
          to_input = (os.getenv("INPUT_TO_CAIRO") or "").strip()
          slot = (os.getenv("INPUT_WINDOW_SLOT") or "").strip()
          should_run = True
          skip_reason = ""

          slot_map = {
              "1705": ((0, 2, 0), (0, 17, 0)),
              "1805": ((0, 17, 0), (0, 18, 0)),
              "1905": ((0, 18, 0), (0, 19, 0)),
              "2005": ((0, 19, 0), (0, 20, 0)),
              "2105": ((0, 20, 0), (0, 21, 0)),
              "2205": ((0, 21, 0), (0, 22, 0)),
              "2305": ((0, 22, 0), (0, 23, 0)),
              "0005": ((-1, 23, 0), (0, 0, 0)),
              "0105": ((0, 0, 0), (0, 1, 0)),
              "0205": ((0, 1, 0), (0, 2, 0)),
          }

          def fmt(dt):
              return dt.strftime("%Y-%m-%dT%H:%M")

          def resolve_slot(slot_value):
              today = datetime.now(tz).date()
              (from_day_offset, from_hour, from_minute), (to_day_offset, to_hour, to_minute) = slot_map[slot_value]
              from_dt = datetime.combine(today + timedelta(days=from_day_offset), datetime.min.time(), tz) \
                  .replace(hour=from_hour, minute=from_minute)
              to_dt = datetime.combine(today + timedelta(days=to_day_offset), datetime.min.time(), tz) \
                  .replace(hour=to_hour, minute=to_minute)
              return fmt(from_dt), fmt(to_dt)

          if from_input and to_input:
              resolved_from = from_input
              resolved_to = to_input
              reason = "explicit inputs"
          elif slot:
              if slot not in slot_map:
                  raise SystemExit(
                      "Unsupported window_slot. Use one of: "
                      + ",".join(slot_map.keys())
                  )
              resolved_from, resolved_to = resolve_slot(slot)
              reason = f"window_slot={slot}"
          elif event_name == "schedule":
              now_cairo = datetime.now(tz)
              current_minute = now_cairo.minute
              slot_candidate = f"{now_cairo.strftime('%H')}05"

              # GitHub scheduled workflows can start late. Allow a wider grace
              # window so a delayed start like 19:14 Cairo still runs slot 1905.
              if 5 <= current_minute <= 29 and slot_candidate in slot_map:
                  slot = slot_candidate
                  resolved_from, resolved_to = resolve_slot(slot)
                  reason = f"scheduled slot={slot}"
              else:
                  should_run = False
                  resolved_from = ""
                  resolved_to = ""
                  reason = "scheduled run outside configured Cairo ETL slots"
                  skip_reason = f"Current Cairo time {now_cairo.strftime('%Y-%m-%d %H:%M')} does not map to an ETL slot."
          else:
              raise SystemExit("Provide either from_cairo/to_cairo or window_slot.")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"from_cairo={resolved_from}\n")
              fh.write(f"to_cairo={resolved_to}\n")
              fh.write(f"skip_reason={skip_reason}\n")

          if should_run:
              print(f"Resolved Cairo window ({reason}): {resolved_from} -> {resolved_to}")
          else:
              print(f"Skipping workflow: {reason}")
              print(skip_reason)
          PY

      - name: Skip non-slot schedule runs
        if: steps.resolve_window.outputs.should_run != 'true'
        run: |
          echo "Skipping Freshchat ETL."
          echo "${{ steps.resolve_window.outputs.skip_reason }}"

      - name: Cache pip
        if: steps.resolve_window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('freshchat_hourly_etl.py') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
            pip-${{ runner.os }}-

      - name: Install dependencies
        if: steps.resolve_window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas gspread google-auth

      - name: Run ETL Script
        if: steps.resolve_window.outputs.should_run == 'true'
        env:
          FRESHCHAT_TOKEN: ${{ secrets.FRESHCHAT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FROM_CAIRO: ${{ steps.resolve_window.outputs.from_cairo }}
          TO_CAIRO: ${{ steps.resolve_window.outputs.to_cairo }}
          ETL_RUN_MODE: once
          ETL_ENFORCE_CAIRO_MINUTE: "0"
          ETL_CAIRO_MINUTE: "1"
        run: python freshchat_hourly_etl.py

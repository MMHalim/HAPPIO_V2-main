name: Freshchat Hourly ETL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: etl (default) or test (10s)"
        required: false
        default: "etl"
      from_cairo:
        description: "From (Africa/Cairo) - YYYY-MM-DDTHH:MM"
        required: false
      to_cairo:
        description: "To (Africa/Cairo) - YYYY-MM-DDTHH:MM"
        required: false

jobs:
  minutes-test:
    if: ${{ github.event.inputs.mode == 'test' }}
    runs-on: ubuntu-latest
    steps:
      - name: Quick test
        run: |
          echo "Actions test started"
          sleep 10
          echo "Actions test done"

  run-etl:
    if: ${{ github.event.inputs.mode != 'test' }}
    concurrency:
      group: freshchat-hourly-etl
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('freshchat_hourly_etl.py') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas gspread google-auth

      - name: Run ETL Script
        env:
          FRESHCHAT_TOKEN: ${{ secrets.FRESHCHAT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FROM_CAIRO: ${{ github.event.inputs.from_cairo }}
          TO_CAIRO: ${{ github.event.inputs.to_cairo }}
          ETL_RUN_MODE: once
          ETL_ENFORCE_CAIRO_MINUTE: "0"
          ETL_CAIRO_MINUTE: "1"
        run: python freshchat_hourly_etl.py

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Modern Quality Management System</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="global-theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
 }
        
        :root {
            --bg-primary: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            --bg-secondary: rgba(15, 23, 42, 0.6);
            --bg-card: rgba(15, 23, 42, 0.6);
            --bg-header: rgba(15, 23, 42, 0.8);
            --bg-user-menu: rgba(255, 255, 255, 0.1);
            --bg-theme-toggle: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-meta: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(96, 165, 250, 0.3);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
 }
        
        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
            --bg-secondary: rgba(255, 255, 255, 0.8);
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-header: rgba(255, 255, 255, 0.95);
            --bg-user-menu: rgba(15, 23, 42, 0.1);
            --bg-theme-toggle: rgba(15, 23, 42, 0.1);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-meta: #64748b;
            --border-color: rgba(15, 23, 42, 0.1);
            --border-hover: rgba(59, 130, 246, 0.3);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
 }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            transition: all 0.3s ease;
 }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: 50px auto;
 }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #1E293B;
            margin-bottom: 20px;
 }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
 }
        
        .input-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 8px;
 }
        
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            background: #FFFFFF;
            transition: border-color 0.2s;
 }
        
        .input-group input:focus {
            outline: none;
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
 }
        
        .btn-primary {
            width: 100%;
            padding: 12px 24px;
            background: #6366F1;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 16px;
 }
        
        .btn-primary:hover {
            background: #5B5BD6;
 }
        
        .forgot-password {
            color: #6366F1;
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
 }
        
        .dashboard-preview {
            display: none;
            background: transparent;
            min-height: 100vh;
            padding: 0;
            width: 100%;
 }
        
        .header {
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 32px;
            margin: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
 }
        
        .app-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
 }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
 }
        
        .theme-toggle {
            background: var(--bg-theme-toggle);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
            font-size: 18px;
 }
        
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
 }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-user-menu);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
 }
        
        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
 }
        
        .user-info .user-email {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
 }
        
        .user-avatar {
            width: 30px;
            height: 30px;
            background: #6366F1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
 }
        
        .scorecard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
 }

        .mtd-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow);
            margin: 20px;
            min-height: calc(100vh - 200px);
            transition: background 0.8s ease, border-color 0.6s ease, box-shadow 0.6s ease;
 }
        .mtd-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            text-align: center;
 }
        .mtd-note {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
            font-weight: 500;
 }
        .mtd-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: grid;
            gap: 20px;
            padding-bottom: 10px;
            justify-items: center;
            width: 100%;
 }
        
        /* Dynamic grid based on number of agents */
        .mtd-list[data-count="1"] { grid-template-columns: 1fr; }
        .mtd-list[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
        .mtd-list[data-count="3"] { grid-template-columns: repeat(3, 1fr); }
        .mtd-list[data-count="4"] { grid-template-columns: repeat(4, 1fr); }
        .mtd-list[data-count="5"] { grid-template-columns: repeat(5, 1fr); }
        
        .mtd-list::-webkit-scrollbar {
            height: 8px;
 }
        
        .mtd-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
 }
        
        .mtd-list::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.5);
            border-radius: 4px;
 }
        
        .mtd-list::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.7);
 }
        
        /* Responsive adjustments for dynamic grid */
        @media (max-width: 1400px) {
            .mtd-list[data-count="5"] { grid-template-columns: repeat(4, 1fr); }
            .mtd-list[data-count="4"] { grid-template-columns: repeat(3, 1fr); }
            .mtd-list[data-count="3"] { grid-template-columns: repeat(3, 1fr); }
            .mtd-list[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
 }
        
        @media (max-width: 1100px) {
            .mtd-list[data-count="5"] { grid-template-columns: repeat(3, 1fr); }
            .mtd-list[data-count="4"] { grid-template-columns: repeat(3, 1fr); }
            .mtd-list[data-count="3"] { grid-template-columns: repeat(2, 1fr); }
            .mtd-list[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
 }
        
        @media (max-width: 800px) {
            .mtd-list[data-count="5"] { grid-template-columns: repeat(2, 1fr); }
            .mtd-list[data-count="4"] { grid-template-columns: repeat(2, 1fr); }
            .mtd-list[data-count="3"] { grid-template-columns: repeat(2, 1fr); }
            .mtd-list[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
 }
        
        @media (max-width: 500px) {
            .mtd-list[data-count="5"] { grid-template-columns: 1fr; }
            .mtd-list[data-count="4"] { grid-template-columns: 1fr; }
            .mtd-list[data-count="3"] { grid-template-columns: 1fr; }
            .mtd-list[data-count="2"] { grid-template-columns: 1fr; }
 }
        .mtd-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: all 0.6s ease, background 0.8s ease, border-color 0.6s ease, color 0.6s ease;
            position: relative;
            overflow: hidden;
            min-height: 140px;
            text-align: center;
 }
        .mtd-item:hover {
            background: var(--bg-user-menu);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
 }
        .mtd-item:first-child {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 193, 7, 0.1) 100%);
            border-color: rgba(255, 215, 0, 0.3);
 }
        .mtd-item:nth-child(2) {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.2) 0%, rgba(156, 163, 175, 0.1) 100%);
            border-color: rgba(192, 192, 192, 0.3);
 }
        .mtd-item:nth-child(3) {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.2) 0%, rgba(180, 83, 9, 0.1) 100%);
            border-color: rgba(205, 127, 50, 0.3);
 }
        .mtd-left { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 12px; 
            width: 100%;
 }
        .mtd-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #f8fafc;
            font-size: 18px;
            position: relative;
 }
        .mtd-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .mtd-name { 
            font-weight: 700; 
            color: var(--text-primary); 
            font-size: 14px; 
            margin-bottom: 4px;
            text-align: center;
 }
        .mtd-meta { 
            color: var(--text-meta); 
            font-size: 12px; 
            margin-bottom: 8px; 
            font-weight: 500; 
 }
        .mtd-score {
            font-weight: 800;
            font-size: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: auto;
 }
        .mtd-category { margin-bottom: 40px; }
        .mtd-category-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-hover);
            text-align: center;
 }
        .mtd-category-empty {
            color: #64748b;
            font-style: italic;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
 }
        
        /* Special styling for top 3 ranks */
        .rank-1 .mtd-avatar {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
 }
        .rank-2 .mtd-avatar {
            border-color: #c0c0c0;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.5);
 }
        .rank-3 .mtd-avatar {
            border-color: #cd7f32;
            box-shadow: 0 0 20px rgba(205, 127, 50, 0.5);
 }
        
        /* Pulsing animation for #1 */
        .rank-1 {
            animation: pulse-gold 2s infinite;
 }
        
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
 }
        
        /* Floating animation for top 3 */
        .rank-1, .rank-2, .rank-3 {
            animation: float 3s ease-in-out infinite;
 }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
 }
        
        .scorecard-card {
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #E2E8F0;
            transition: transform 0.2s, box-shadow 0.2s;
 }
        
        .scorecard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
 }
        
        .card-icon {
            width: 50px;
            height: 50px;
            background: #6366F1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
 }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #1E293B;
            margin-bottom: 8px;
 }
        
        .card-description {
            color: #64748B;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
 }
        
        .btn-access {
            background: #6366F1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
 }
        
        .btn-access:hover {
            background: #5B5BD6;
 }
        
        .navigation {
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
 }
        
        .nav-items {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
 }
        
        .nav-item {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
 }
        
        .nav-item:hover {
            background: #6366F1;
            color: white;
            transform: translateY(-2px);
 }
        
        .nav-icon {
            font-size: 20px;
            margin-bottom: 8px;
 }
        
        .nav-label {
            font-size: 12px;
            font-weight: bold;
 }
        
        /* Responsive design for header */
        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
                margin: 10px;
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
 }
            
            .app-title {
                font-size: 24px;
                text-align: center;
 }
            
            .header-controls {
                justify-content: center;
                gap: 12px;
 }
            
            .user-menu {
                padding: 8px 16px;
                gap: 12px;
 }
            
            .user-avatar {
                width: 24px;
                height: 24px;
                font-size: 14px;
 }
            
            .user-info .user-email {
                font-size: 12px;
 }
            
            .theme-toggle {
                padding: 8px;
                font-size: 16px;
 }
 }
        
        @media (max-width: 480px) {
            .header {
                padding: 12px 16px;
                margin: 8px;
 }
            
            .app-title {
                font-size: 20px;
 }
            
            .user-menu {
                padding: 6px 12px;
                gap: 8px;
 }
            
            .user-info .user-email {
                font-size: 11px;
 }
 }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="logo">🎯 Quality Management</div>
        <form onsubmit="signIn(event)">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
            <div id="loginError" style="margin-top:10px;color:#EF4444;font-size:14px;display:none;"></div>
            <div class="forgot-password" onclick="alert('Forgot password functionality would be implemented here')">
                Forgot your password?
            </div>
        </form>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="dashboard-preview">

        <div class="mtd-card" style="margin-top: 100px;">
            <div class="mtd-title">Top 5 Agent Rankings by Category</div>
            <div class="mtd-note">Top performers MTD</div>
            <div id="mtdContainer"></div>
        </div>
    </div>

    <!-- Global Theme and Navigation Script -->
    <script src="global-navigation.js"></script>
    
    <script>
        // Authentication and URL routing functions
        function checkAuthentication() {
            const token = localStorage.getItem('login_token');
            const userEmail = localStorage.getItem('loggedInUserEmail');
            
            if (token && userEmail) {
                // User is authenticated, show dashboard
                showDashboard();
                return true;
 } else {
                // User is not authenticated, show login
                showLogin();
                return false;
 }
 }

        // Load current user's profile data
        async function loadCurrentUserProfile(email, token) {
            try {
                const SUPABASE_URL = 'https://kupaxfvjfobfdgtbfnnt.supabase.co';
                const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cGF4ZnZqZm9iZmRndGJmbm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE2ODQwNjAwOTgsImV4cCI6MTk5OTYzNjA5OH0.C-6VUYI6VT0qr39K5rTSLt_hq6Y-dRBjIm6Dr-OGsaw';
                
                const url = new URL(`${SUPABASE_URL}/rest/v1/users`);
                url.searchParams.set('select', 'Name,email,profile_photo,user_role');
                url.searchParams.set('email', `eq.${email}`);
                url.searchParams.set('limit', '1');
                
                const res = await fetch(url.toString(), {
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
 }
 });
                
                if (res.ok) {
                    const rows = await res.json();
                    if (rows && rows.length > 0) {
                        const user = rows[0];
                        if (user.Name) {
                            localStorage.setItem('userName', user.Name);
 }
                        if (user.profile_photo) {
                            localStorage.setItem('userProfilePhoto', user.profile_photo);
 }
                        const roleVal = user.user_role || user.role;
                        if (roleVal) {
                            localStorage.setItem('user_role', roleVal);
                            localStorage.setItem('role', roleVal);
 }
 }
 } else {
 }
 } catch (error) {
                console.error('Error loading current user profile:', error);
 }
 }

        function showLogin() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboardScreen').style.display = 'none';
            
            // Clear any existing navigation
            if (window.GlobalNavigation) {
                window.GlobalNavigation.clearNavigation();
 }
            
            // Redirect to explicit login URL
            window.history.replaceState({}, 'Login', '/login.html');
 }

        function showDashboard() {
            const userEmail = localStorage.getItem('loggedInUserEmail');
            const token = localStorage.getItem('login_token');
            const userName = localStorage.getItem('userName') || 'User';
            const userProfilePhoto = localStorage.getItem('userProfilePhoto');
            
            // Update user email in the header
            const userEmailElement = document.getElementById('userEmail');
            if (userEmailElement) {
                userEmailElement.textContent = userEmail;
 }
            
            // Update user avatar
            const userAvatar = document.getElementById('user-avatar');
            const userInitials = document.getElementById('user-initials');
            if (userAvatar && userInitials) {
                if (userProfilePhoto && userProfilePhoto.trim() !== '' && 
                    (userProfilePhoto.startsWith('http') || userProfilePhoto.startsWith('data:'))) {
                    userAvatar.innerHTML = `
                        <img src="${userProfilePhoto}" alt="${userName}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                             onload="this.nextElementSibling.style.display='none';"
                             style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                        <span id="user-initials" style="display: none;">${userName.charAt(0).toUpperCase()}</span>
                    `;
 } else {
                    userInitials.textContent = userName.charAt(0).toUpperCase();
 }
 }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            
            // Redirect to explicit dashboard URL BEFORE mounting global navigation
            // This ensures navigation guard detects the correct state immediately
            window.history.replaceState({}, 'Dashboard', '/dashboard/');
            
            // Show global navigation after login (now that URL reflects dashboard)
            if (window.globalNav) {
                window.globalNav.showNavigation();
 }
            
            // Load MTD ranking
            loadMtdRanking(token);
 }

        function logout() {
            // Clear localStorage
            localStorage.removeItem('login_token');
            localStorage.removeItem('loggedInUserEmail');
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_role');
            
            // Hide global navigation after logout
            if (window.globalNav) {
                window.globalNav.hideNavigation();
 }
            
            // Show login screen
            showLogin();
 }

        // Handle browser back/forward buttons
        window.addEventListener('popstate', function(event) {
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page');
            
            if (page === 'dashboard') {
                if (checkAuthentication()) {

        async function loadCategoryRanking(SUPABASE_URL, ANON_KEY, token, tableName) {
            const now = new Date();
            const first = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

            // Different field names for different tables
            let nameField = 'Agent_Name';
            if (tableName === 'T2_OS_NEW_2025') {
                nameField = 'Agent_Name'; // Try Agent_Name first, fallback to other fields
 }

            const url = new URL(`${SUPABASE_URL}/rest/v1/${tableName}`);
            url.searchParams.set('select', `${nameField},Final_Score,date_created`);
            url.searchParams.set('date_created', `gte.${first}`);
            url.searchParams.append('date_created', `lte.${today}`);
            url.searchParams.set('limit', '10000');

            const res = await fetch(url.toString(), {
                headers: {
                    'apikey': ANON_KEY,
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
 }
 });
            if (!res.ok) throw new Error(`Failed to fetch ${tableName}`);
            const rows = await res.json();

            // Aggregate avg score per agent
            const map = new Map();
            for (const r of rows) {
                // Try different possible name fields
                let name = r.Agent_Name || r.agent_name || r.AgentName || r.agentName || r.Name || r.name || 'Unknown';
                
                // If it looks like an email, try to extract name or use email as fallback
                if (name.includes('@') && name.includes('.')) {
                    // It's an email, try to get name from users table or use email
                    name = name.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
 }
                
                const pctStr = (r.Final_Score || '').toString().replace('%','').trim();
                const val = Number(pctStr);
                if (!Number.isFinite(val)) continue;
                const e = map.get(name) || { sum: 0, n: 0 };
                e.sum += val;
                e.n += 1;
                map.set(name, e);
 }
            return Array.from(map.entries()).map(([name, e]) => ({
                name,
                avg: e.n ? Math.round((e.sum / e.n) * 100) / 100 : 0,
                count: e.n
 })).sort((a,b) => b.avg - a.avg);
 }
        
        async function fetchUserPhotos(SUPABASE_URL, ANON_KEY, token) {
            try {
                const url = new URL(`${SUPABASE_URL}/rest/v1/users`);
                url.searchParams.set('select', 'Name,email,profile_photo');
                url.searchParams.set('limit', '10000');
                const res = await fetch(url.toString(), {
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
 }
 });
                if (!res.ok) {
                    return new Map();
 }
                const rows = await res.json();
                const nameMap = new Map();
                const emailMap = new Map();
                for (const r of rows) {
                    const name = r.Name || '';
                    const email = r.email || '';
                    const photo = r.profile_photo || '';
                    if (name && photo) {
                        // Map by name (since scorecard data uses Agent_Name which should match Name)
                        nameMap.set(name, photo);
 }
                    if (email && photo) {
                        // Also map by email for potential future use
                        emailMap.set(email, photo);
 }
 }
                return { nameMap, emailMap };
 } catch (err) {
                console.error('Error fetching user photos:', err);
                return new Map();
 }
 }

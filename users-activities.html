<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activities - Quality Management Dashboard</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="global-theme.css">
    <style>
        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .filters-section {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .input-control {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 14px;
            min-width: 200px;
        }

        .date-range-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 8px;
        }

        .date-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 4px;
            width: 130px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .data-table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
        }

        tr:hover {
            background: var(--bg-secondary);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-login {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .status-logout {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="global-navigation"></div>

    <div class="page-container">
        <div class="page-header">
            <div class="page-title-group">
                <div>
                    <h1 class="page-title">User Activities</h1>
                    <div class="page-subtitle">Monitor user login sessions and activities</div>
                </div>
            </div>

            <div class="filters-section">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <input type="text" id="searchInput" class="input-control" placeholder="Filter by name, email, status...">
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Date Range</label>
                    <div class="date-range-group">
                        <input type="date" id="startDate" class="date-input">
                        <span>to</span>
                        <input type="date" id="endDate" class="date-input">
                    </div>
                </div>

                <div class="filter-group" style="justify-content: flex-end;">
                    <button id="refreshBtn" class="btn-primary">Refresh</button>
                    <button id="exportBtn" class="btn-primary" style="background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color);">Export CSV</button>
                </div>
            </div>
        </div>

        <div class="data-table-container">
            <table id="activitiesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date & Time</th>
                        <th>Agent Name</th>
                        <th>Agent Email</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="loading-state">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="global-theme.js"></script>
    <script src="global-navigation.js"></script>
    <script src="users-activities.js"></script>
</body>
</html>

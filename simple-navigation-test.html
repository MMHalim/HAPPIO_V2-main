<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navigation Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1e293b;
            color: white;
        }
        
        .test-nav {
            background: #0f172a;
            padding: 20px;
            border-bottom: 1px solid #334155;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-items {
            display: flex;
            gap: 20px;
        }
        
        .nav-item {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            background: #334155;
            transition: background 0.3s;
        }
        
        .nav-item:hover {
            background: #475569;
        }
        
        .nav-item.active {
            background: #3b82f6;
        }
        
        .content {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .debug {
            background: #334155;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-nav">
        <div class="nav-container">
            <div class="nav-items">
                <a href="/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/scorecard.html" class="nav-item">📝 Scorecard</a>
                <a href="/manage-users.html" class="nav-item active">👥 Manage Users</a>
                <a href="/analytics.html" class="nav-item">📈 Analytics</a>
                <a href="/settings.html" class="nav-item">⚙️ Settings</a>
            </div>
            <div>
                <button onclick="toggleTheme()" style="background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer;">
                    🌙 Toggle Theme
                </button>
            </div>
        </div>
    </div>

    <div class="content">
        <h1>Simple Navigation Test</h1>
        <p>This is a simple test to see if basic navigation works without the complex global navigation system.</p>
        
        <div class="debug">
            <h3>Debug Information:</h3>
            <p>Current URL: <span id="url"></span></p>
            <p>Current Page: <span id="page"></span></p>
            <p>Navigation should be visible above.</p>
        </div>
        
        <div class="debug">
            <h3>Test Global Navigation:</h3>
            <button onclick="testGlobalNav()">Test Global Navigation</button>
            <button onclick="createSimpleNav()">Create Simple Navigation</button>
            <div id="nav-status"></div>
        </div>
    </div>

    <script>
        // Update debug info
        document.getElementById('url').textContent = window.location.href;
        document.getElementById('page').textContent = window.location.pathname;
        
        // Theme toggle
        function toggleTheme() {
            document.body.style.background = document.body.style.background === 'white' ? '#1e293b' : 'white';
            document.body.style.color = document.body.style.color === 'white' ? 'black' : 'white';
        }
        
        // Test global navigation
        function testGlobalNav() {
            const status = document.getElementById('nav-status');
            if (window.globalNav) {
                status.innerHTML = '<p style="color: green;">✅ Global Navigation is loaded</p>';
                status.innerHTML += '<p>Navigation items: ' + window.globalNav.navigationItems.length + '</p>';
            } else {
                status.innerHTML = '<p style="color: red;">❌ Global Navigation is not loaded</p>';
            }
        }
        
        // Create simple navigation manually
        function createSimpleNav() {
            const status = document.getElementById('nav-status');
            try {
                // Try to create navigation manually
                const nav = document.createElement('div');
                nav.innerHTML = `
                    <div style="background: #0f172a; padding: 20px; color: white;">
                        <h3>Manual Navigation Created</h3>
                        <p>This proves the DOM manipulation works.</p>
                    </div>
                `;
                document.body.appendChild(nav);
                status.innerHTML = '<p style="color: green;">✅ Manual navigation created successfully</p>';
            } catch (error) {
                status.innerHTML = '<p style="color: red;">❌ Error creating navigation: ' + error.message + '</p>';
            }
        }
        
        // Check if global navigation script is loaded
        setTimeout(() => {
            const status = document.getElementById('nav-status');
            if (typeof GlobalNavigation !== 'undefined') {
                status.innerHTML += '<p style="color: green;">✅ GlobalNavigation class is available</p>';
            } else {
                status.innerHTML += '<p style="color: red;">❌ GlobalNavigation class is not available</p>';
            }
        }, 1000);
    </script>

    <!-- Try to load global navigation -->
    <script src="global-navigation.js"></script>
</body>
</html>
